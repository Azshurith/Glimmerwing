<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Glimmerwing</title>
        <meta
            name="description"
            content="A split-screen versus shooter: chain dandelion bursts in your meadow to send stars into your rival's."
        />
        <meta name="theme-color" content="#100b24" />
        <!-- Installable: home screen on phones and tablets, an app window on desktop. -->
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" type="image/png" href="icon-192.png" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Glimmerwing" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600;1,9..144,700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f1ecfa;
                --ink: #2a1d52;
                --muted: #5d5280;
                --btn: #2a1d52;
                --btn-ink: #f6f0ff;
                --edge: #c9bde6;
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    --bg: #100b24;
                    --ink: #f6f0ff;
                    --muted: #a99fc8;
                    --btn: #ffd86b;
                    --btn-ink: #100b24;
                    --edge: #2f2557;
                    color-scheme: dark;
                }
            }
            :root[data-theme='dark'] {
                --bg: #100b24;
                --ink: #f6f0ff;
                --muted: #a99fc8;
                --btn: #ffd86b;
                --btn-ink: #100b24;
                --edge: #2f2557;
                color-scheme: dark;
            }
            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }
            html {
                height: 100%;
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            /* The page is only the game: it fills the window (see .stage.immersive). How to play,
               controls and settings live on guide.html. */
            body {
                margin: 0;
                min-height: 100%;
                background: #05030d;
                color: var(--ink);
                font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
                overflow: hidden;
            }
            button {
                touch-action: manipulation;
            }
            button {
                font: inherit;
                font-size: 0.9rem;
                font-weight: 600;
                border: 0;
                border-radius: 999px;
                padding: 0.6rem 1.1rem;
                background: var(--btn);
                color: var(--btn-ink);
                cursor: pointer;
            }
            button.ghost {
                background: transparent;
                color: var(--ink);
                box-shadow: inset 0 0 0 2px var(--btn);
            }
            button:focus-visible,
            canvas:focus-visible {
                outline: 3px solid #ffd36e;
                outline-offset: 3px;
            }
            .stage {
                width: 100%;
                max-width: 1000px;
                position: relative;
            }
            /* The game screen: canvas plus everything layered on it. main.ts sizes it to fit the window. */
            .screen {
                position: relative;
                width: 100%;
                margin: 0 auto;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            /* Fullscreen (or, where the browser can't, a fixed full-window layer, as on iPhone). */
            .stage.immersive {
                position: fixed;
                inset: 0;
                z-index: 10;
                max-width: none;
                background: #05030d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
                    env(safe-area-inset-left, 0px);
            }
            .stage.immersive canvas {
                border-radius: 0;
                box-shadow: none;
            }
            body:has(.stage.immersive) {
                overflow: hidden;
            }

            /* On-screen buttons, shown once the player uses a touchscreen. */
            .touch-ui {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: none;
            }
            html.touch .touch-ui {
                display: block;
            }
            .tb {
                pointer-events: auto;
                touch-action: none;
                position: absolute;
                --btn: clamp(44px, calc(var(--sw, 600px) * 0.1), 76px);
                width: var(--btn);
                aspect-ratio: 1;
                padding: 0;
                border-radius: 50%;
                font:
                    400 calc(var(--btn) * 0.19) 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.02em;
                background: rgba(16, 11, 36, 0.5);
                color: #fff3c9;
                box-shadow: inset 0 0 0 2px rgba(255, 216, 107, 0.75);
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);
            }
            .tb.active {
                background: rgba(255, 216, 107, 0.9);
                color: #140a26;
            }
            .tb.small {
                --btn: clamp(34px, calc(var(--sw, 600px) * 0.065), 52px);
                font-size: calc(var(--btn) * 0.34);
            }
            .tb-menu {
                top: 2.5%;
                left: 50%;
                transform: translateX(-50%);
            }
            /* Exit sits in the gap between the meadows, under the pause button, clear of both HUDs. */
            .screen[data-phase='title'] .tb-menu {
                display: none;
            }
            /* On the select screen the header and timer own the top centre; Back goes in the corner. */
            .screen[data-phase='select'] .tb-menu {
                top: 1%;
                left: 1%;
                transform: none;
            }
            /* Corner buttons on the title screen, on every device (the touch layer only shows on touchscreens). */
            .corner-ui {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: none;
            }
            .screen[data-phase='title'] .corner-ui {
                display: block;
            }
            .corner-ui .tb {
                top: 1%;
                display: grid;
                place-items: center;
                text-decoration: none;
            }
            #tb-sound {
                left: 1.5%;
            }
            #tb-guide {
                right: 1.5%;
            }
            #tb-full {
                right: calc(1.5% + var(--btn) + 8px);
            }
            #tb-full[hidden] {
                display: none;
            }
            .pad {
                position: absolute;
                bottom: 10%;
                display: none;
                gap: 0.4rem;
                align-items: flex-end;
            }
            .pad .tb {
                position: static;
                opacity: 0.85;
            }
            .screen:is([data-phase='playing'], [data-phase='countdown'], [data-phase='roundOver']) .pad-a {
                display: flex;
            }
            .pad-a {
                right: 2.5%;
            }
            .screen[data-mode='versus'] .pad-a {
                right: auto;
                left: 2.5%;
                flex-direction: row-reverse;
            }
            .screen[data-mode='versus']:is([data-phase='playing'], [data-phase='countdown'], [data-phase='roundOver'])
                .pad-b {
                display: flex;
                right: 2.5%;
            }

            /* Tall layout (portrait, one player): buttons go in the strip under your meadow,
               pause and exit in its corners, clear of the meadows and the console. */
            .screen[data-layout='tall'] .pad-a {
                bottom: 1.5%;
                right: 4%;
            }
            .screen[data-layout='tall'] .tb-menu {
                top: auto;
                bottom: 2%;
                left: 4%;
                transform: none;
            }
            /* Tall menus: back (select) and exit sit in the top corners, beside the heading. */
            .screen[data-layout='tall']:is([data-phase='select'], [data-phase='title']) .tb-menu {
                top: 1%;
                bottom: auto;
                left: 1.5%;
            }
            /* Sound toggle for the full-screen game, where the page's mute button is out of sight.
               It shows on the title screen, in the corner the pause button leaves free there. */
            #lobby {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: rgba(16, 11, 36, 0.72);
                border-radius: 14px;
                padding: 1rem;
            }
            #lobby[hidden] {
                display: none;
            }
            .lobby-card {
                width: min(100%, 26rem);
                background: var(--bg);
                color: var(--ink);
                border-radius: 14px;
                padding: 1.2rem 1.4rem;
                display: grid;
                gap: 0.8rem;
                box-shadow:
                    0 0 0 1px var(--edge),
                    0 12px 40px rgba(0, 0, 0, 0.35);
                text-align: center;
            }
            .lobby-card h2 {
                margin: 0;
                font-style: italic;
                font-size: 1.4rem;
            }
            .lobby-friend {
                display: grid;
                gap: 0.5rem;
                padding-top: 0.8rem;
                border-top: 1px solid var(--edge);
            }
            #lobby-join {
                display: flex;
                gap: 0.5rem;
            }
            #lobby-join-code {
                flex: 1;
                min-width: 0;
                font: inherit;
                font-size: 1rem;
                letter-spacing: 0.3em;
                text-align: center;
                text-transform: uppercase;
                padding: 0.5rem 0.8rem;
                border-radius: 999px;
                border: 2px solid var(--edge);
                background: transparent;
                color: var(--ink);
            }
            #lobby-code {
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: 0.25em;
                color: var(--ink);
            }
            #lobby-status {
                margin: 0;
                min-height: 1.4em;
                font-size: 0.85rem;
                color: var(--muted);
                overflow-wrap: anywhere;
            }
            canvas {
                display: block;
                width: 100%;
                /* main.ts sets --view-ratio to the current layout's shape (wide or tall). */
                aspect-ratio: var(--view-ratio, 504 / 320);
                border-radius: 14px;
                touch-action: none;
                background: #100b24;
                box-shadow: 0 0 0 1px var(--edge);
            }
            button.link {
                background: none;
                color: var(--muted);
                padding: 0.2rem 0;
                text-decoration: underline;
                font-weight: 400;
                font-size: 0.8rem;
                border-radius: 0;
            }
        </style>
    </head>
    <body>
        <div class="stage immersive" id="stage">
            <div class="screen" id="screen">
                <canvas id="game" tabindex="0" aria-label="Glimmerwing playfield"></canvas>
                <div class="touch-ui" aria-hidden="false">
                    <button class="tb small tb-menu" id="menu-btn" data-key="Escape" aria-label="Pause">❚❚</button>
                    <!-- One player (or 1P in versus): B blooms, C autofires while held. -->
                    <div class="pad pad-a">
                        <button class="tb" data-key="KeyF" aria-label="Autofire">Auto</button>
                        <button class="tb" data-key="KeyH" aria-label="Bomb">Bomb</button>
                    </div>
                    <div class="pad pad-b">
                        <button class="tb" data-key="Quote" aria-label="Player two autofire">Auto</button>
                        <button class="tb" data-key="ShiftRight" aria-label="Player two bomb">Bomb</button>
                    </div>
                </div>
                <!-- Title-screen corners, on every device: sound, fullscreen, and the guide page. -->
                <div class="corner-ui">
                    <button class="tb small" id="tb-sound" aria-label="Sound" aria-pressed="true">♪</button>
                    <button class="tb small" id="tb-full" aria-label="Fullscreen">⛶</button>
                    <a class="tb small" id="tb-guide" href="guide.html" aria-label="How to play and settings">?</a>
                </div>
                <div id="lobby" role="dialog" aria-modal="true" aria-labelledby="lobby-title" hidden>
                    <div class="lobby-card">
                        <h2 id="lobby-title">Play online</h2>
                        <button id="lobby-quick">Find match</button>
                        <div class="lobby-friend">
                            <button id="lobby-host" class="ghost">Create friend room</button>
                            <form id="lobby-join">
                                <input
                                    id="lobby-join-code"
                                    maxlength="4"
                                    placeholder="CODE"
                                    autocomplete="off"
                                    autocapitalize="characters"
                                    spellcheck="false"
                                    aria-label="Room code"
                                />
                                <button class="ghost">Join</button>
                            </form>
                        </div>
                        <output id="lobby-code" hidden></output>
                        <p id="lobby-status" role="status" aria-live="polite"></p>
                        <button class="link" id="lobby-close">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            /*__BUNDLE__*/
        </script>
    </body>
</html>
