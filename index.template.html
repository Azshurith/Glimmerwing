<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Glimmerwing</title>
        <meta
            name="description"
            content="A split-screen versus shooter: chain dandelion bursts in your meadow to send stars into your rival's."
        />
        <meta name="theme-color" content="#100b24" />
        <!-- Installable: home screen on phones and tablets, an app window on desktop. -->
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="icon" type="image/png" href="icon-192.png" />
        <link rel="apple-touch-icon" href="icon-192.png" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Glimmerwing" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Bungee&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600;1,9..144,700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #f1ecfa;
                --ink: #2a1d52;
                --muted: #5d5280;
                --btn: #2a1d52;
                --btn-ink: #f6f0ff;
                --edge: #c9bde6;
                color-scheme: light;
                box-sizing: border-box;
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme='light']) {
                    --bg: #100b24;
                    --ink: #f6f0ff;
                    --muted: #a99fc8;
                    --btn: #ffd86b;
                    --btn-ink: #100b24;
                    --edge: #2f2557;
                    color-scheme: dark;
                }
            }
            :root[data-theme='dark'] {
                --bg: #100b24;
                --ink: #f6f0ff;
                --muted: #a99fc8;
                --btn: #ffd86b;
                --btn-ink: #100b24;
                --edge: #2f2557;
                color-scheme: dark;
            }
            *,
            *::before,
            *::after {
                box-sizing: inherit;
            }
            html {
                height: 100%;
                scroll-padding-top: env(safe-area-inset-top, 0px);
            }
            /* The page is only the game: it fills the window (see .stage.immersive). How to play,
               controls and settings live on guide.html. */
            body {
                margin: 0;
                min-height: 100%;
                background: #05030d;
                color: var(--ink);
                font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
                overflow: hidden;
            }
            button {
                touch-action: manipulation;
            }
            button {
                font: inherit;
                font-size: 0.9rem;
                font-weight: 600;
                border: 0;
                border-radius: 999px;
                padding: 0.6rem 1.1rem;
                background: var(--btn);
                color: var(--btn-ink);
                cursor: pointer;
            }
            button.ghost {
                background: transparent;
                color: var(--ink);
                box-shadow: inset 0 0 0 2px var(--btn);
            }
            button:focus-visible,
            canvas:focus-visible {
                outline: 3px solid #ffd36e;
                outline-offset: 3px;
            }
            .stage {
                width: 100%;
                max-width: 1000px;
                position: relative;
            }
            /* The game screen: canvas plus everything layered on it. main.ts sizes it to fit the window. */
            .screen {
                position: relative;
                width: 100%;
                margin: 0 auto;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
            }
            /* Fullscreen (or, where the browser can't, a fixed full-window layer, as on iPhone). */
            .stage.immersive {
                position: fixed;
                inset: 0;
                z-index: 10;
                max-width: none;
                background: #05030d;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px)
                    env(safe-area-inset-left, 0px);
            }
            .stage.immersive canvas {
                border-radius: 0;
                box-shadow: none;
            }
            body:has(.stage.immersive) {
                overflow: hidden;
            }

            /* On-screen buttons, shown once the player uses a touchscreen. */
            .touch-ui {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: none;
            }
            html.touch .touch-ui {
                display: block;
            }
            /* The menu screens' Back button shows on every device, so a mouse can leave them too. */
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .touch-ui {
                display: block;
            }
            .tb {
                pointer-events: auto;
                touch-action: none;
                position: absolute;
                --btn: clamp(44px, calc(var(--sw, 600px) * 0.1), 76px);
                width: var(--btn);
                aspect-ratio: 1;
                padding: 0;
                border-radius: 50%;
                font:
                    400 calc(var(--btn) * 0.19) 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.02em;
                background: rgba(16, 11, 36, 0.5);
                color: #fff3c9;
                box-shadow: inset 0 0 0 2px rgba(255, 216, 107, 0.75);
                -webkit-backdrop-filter: blur(2px);
                backdrop-filter: blur(2px);
            }
            .tb.active {
                background: rgba(255, 216, 107, 0.9);
                color: #140a26;
            }
            .tb.small {
                --btn: clamp(34px, calc(var(--sw, 600px) * 0.065), 52px);
                font-size: calc(var(--btn) * 0.34);
            }
            .tb-menu {
                top: 2.5%;
                left: 50%;
                transform: translateX(-50%);
            }
            .screen[data-phase='title'] .tb-menu {
                display: none;
            }
            /* On the mode menu and select screens the heading owns the top centre; Back goes in the corner. */
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu {
                top: 1%;
                left: 1%;
                transform: none;
            }
            /* On those screens Back is a slanted gold-edged tab, like the game's own buttons, not a round one. */
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu {
                /* Bigger than the round corner buttons, so it holds its own beside the screen's heading. */
                /* …but never taller than the bar it sits in (a phone on its side has a short one), and centred in it. */
                --btn: min(clamp(44px, calc(var(--sw, 600px) * 0.075), 74px), calc((var(--bar-h, 999px) - 8px) / 0.82));
                --sl: calc(var(--btn) * 0.32);
                top: calc((var(--bar-h, 48px) - var(--btn) * 0.82) / 2) !important;
                width: auto;
                height: calc(var(--btn) * 0.82);
                aspect-ratio: auto;
                padding: 0 calc(var(--sl) + 0.55em) 0 calc(var(--sl) + 0.35em);
                border: 0;
                border-radius: 0;
                display: flex;
                align-items: center;
                gap: 0.45em;
                isolation: isolate;
                cursor: pointer;
                font-size: calc(var(--btn) * 0.32);
                letter-spacing: 0.08em;
                color: #fff3c9;
                text-shadow: 0 1px 0 #3a2410;
                background: linear-gradient(180deg, #fff0b0, #e0a83e 55%, #a8701e);
                clip-path: polygon(var(--sl) 0, 100% 0, calc(100% - var(--sl)) 100%, 0 100%);
                box-shadow: none;
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
                transition: filter 0.15s;
            }
            /* The dark face inside the gold edge. */
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu::before {
                content: '';
                position: absolute;
                inset: 2px 3px;
                z-index: -1;
                background: linear-gradient(180deg, #3a2a78, #1b1240 60%, #120c2c);
                clip-path: polygon(var(--sl) 0, 100% 0, calc(100% - var(--sl)) 100%, 0 100%);
            }
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu:hover {
                filter: brightness(1.2) drop-shadow(0 0 6px rgba(255, 216, 107, 0.6));
            }
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu.active::before {
                background: linear-gradient(180deg, #ffe9a0, #d9a040);
            }
            .screen:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings']
                )
                .tb-menu.active {
                color: #1b1240;
                text-shadow: none;
            }
            /* ---- Settings: a full panel in the game's own look (gold edges, slanted tabs, Bungee) ---- */
            /* The Settings panel fills the screen below the canvas's own heading bar (drawn by the game's Settings
               screen, like every menu screen), so the bar and the ◀ Back tab are the same as everywhere else. */
            #settings {
                position: absolute;
                inset: var(--bar-h, 0) 0 0 0;
                display: flex;
                z-index: 5;
                font-family: 'Fraunces', Georgia, serif;
                color: #efe6ff;
                /* Everything in the panel is sized in em from this, so it grows with the screen: about 15px on a
                   phone, up to 24px on a big desktop. */
                font-size: clamp(15px, calc(var(--sw, 600px) * 0.0118), 24px);
            }
            #settings[hidden] {
                display: none;
            }
            /* A page of its own, like the other menu screens: a heading bar with Back, then the tabs and their
               settings in a centred column that scrolls if it has to. */
            /* Landscape: the tabs down the left and their settings filling the rest of the width. Portrait: the tabs
               across the top. Either way the panel spans the whole screen. */
            .set-card {
                position: relative;
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: clamp(9em, 20%, 14em) 1fr;
                grid-template-rows: 1fr auto;
            }
            .screen[data-layout='tall'] .set-card {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
            /* Back: the same slanted gold tab as the other menu screens. */
            .set-tabs {
                display: flex;
                flex-direction: column;
                gap: 0.5em;
                padding: 1.4em 0 0 1.2em;
                border-right: 1px solid rgba(217, 168, 69, 0.25);
            }
            .screen[data-layout='tall'] .set-tabs {
                flex-direction: row;
                padding: 1em 1em 0;
                border-right: 0;
            }
            .set-tab {
                --sl: 0.6em;
                padding: 0.7em var(--sl) 0.65em;
                border: 0;
                cursor: pointer;
                font:
                    400 1.05em 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.06em;
                color: #b9a8e8;
                background: rgba(10, 6, 28, 0.55);
                clip-path: polygon(var(--sl) 0, 100% 0, calc(100% - var(--sl)) 100%, 0 100%);
                transition:
                    background 0.15s,
                    color 0.15s;
            }
            .screen[data-layout='tall'] .set-tab {
                flex: 1;
            }
            .set-tab:hover {
                color: #fff3c9;
                background: rgba(255, 255, 255, 0.12);
            }
            .set-tab[aria-selected='true'] {
                color: #1b1240;
                background: linear-gradient(180deg, #fff0b0, #e0a83e 60%, #c48a2a);
            }
            .set-body {
                min-height: 0;
                overflow-y: auto;
                padding: 1.4em 2em 0.6em;
            }
            .set-pane[hidden] {
                display: none;
            }
            .set-row {
                display: grid;
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: 0.4em 1em;
                padding: 0.65em 0.2em;
                border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            }
            .set-row[hidden] {
                display: none;
            }
            .set-name {
                font:
                    400 1.05em 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.04em;
                color: #fff3c9;
            }
            .set-row small {
                display: block;
                margin-top: 0.15em;
                font-style: italic;
                font-size: 0.8em;
                line-height: 1.35;
                color: #a99fc8;
            }
            /* Volume: a gold slider with its value beside it. */
            .set-vol {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                gap: 0.8em;
            }
            .set-vol output {
                min-width: 2.8em;
                text-align: right;
                font:
                    400 0.85em 'Bungee',
                    'Arial Black',
                    sans-serif;
                color: #ffd86b;
            }
            #settings input[type='range'] {
                font-size: inherit;
                flex: 1;
                height: 1.6em;
                appearance: none;
                -webkit-appearance: none;
                background: transparent;
                cursor: pointer;
                --p: 50%;
            }
            #settings input[type='range']::-webkit-slider-runnable-track {
                height: 0.5em;
                border-radius: 0.25em;
                background: linear-gradient(90deg, #ffd86b var(--p), rgba(255, 255, 255, 0.12) var(--p));
                box-shadow: 0 0 0 1px rgba(217, 168, 69, 0.5);
            }
            #settings input[type='range']::-moz-range-track {
                height: 0.5em;
                border-radius: 0.25em;
                background: linear-gradient(90deg, #ffd86b var(--p), rgba(255, 255, 255, 0.12) var(--p));
            }
            #settings input[type='range']::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 1.15em;
                height: 1.15em;
                margin-top: -0.33em;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 35%, #fffbe6, #ffd86b 55%, #c48a2a);
                box-shadow:
                    0 0 0 2px #1b1240,
                    0 0 8px rgba(255, 216, 107, 0.7);
            }
            #settings input[type='range']::-moz-range-thumb {
                width: 1.15em;
                height: 1.15em;
                border: 0;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 35%, #fffbe6, #ffd86b 55%, #c48a2a);
                box-shadow: 0 0 0 2px #1b1240;
            }
            /* On/off: a switch rather than a bare checkbox. */
            .set-switch {
                position: relative;
                width: 3.1em;
                height: 1.6em;
                flex: none;
            }
            .set-switch input {
                position: absolute;
                inset: 0;
                margin: 0;
                opacity: 0;
                cursor: pointer;
                z-index: 1;
            }
            .set-switch span {
                position: absolute;
                inset: 0;
                border-radius: 1em;
                background: rgba(255, 255, 255, 0.12);
                box-shadow: 0 0 0 1px rgba(217, 168, 69, 0.5) inset;
                transition: background 0.15s;
            }
            .set-switch span::after {
                content: '';
                position: absolute;
                top: 0.2em;
                left: 0.2em;
                width: 1.2em;
                height: 1.2em;
                border-radius: 50%;
                background: #b9a8e8;
                transition:
                    transform 0.15s,
                    background 0.15s;
            }
            .set-switch input:checked + span {
                background: linear-gradient(180deg, #ffe9a0, #d9a040);
            }
            .set-switch input:checked + span::after {
                transform: translateX(1.5em);
                background: #1b1240;
            }
            .set-switch input:focus-visible + span {
                outline: 2px solid #fff3c9;
                outline-offset: 2px;
            }
            /* Controls: whose keys, then a key table. */
            .set-schemes {
                display: flex;
                gap: 0.3em;
                margin-bottom: 0.4em;
            }
            .set-scheme {
                flex: 1;
                padding: 0.45em 0.3em;
                border: 1px solid rgba(217, 168, 69, 0.45);
                border-radius: 4px;
                background: transparent;
                color: #b9a8e8;
                cursor: pointer;
                font:
                    400 0.85em 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.04em;
            }
            .set-scheme[aria-pressed='true'] {
                background: rgba(255, 216, 107, 0.16);
                border-color: #ffd86b;
                color: #fff3c9;
            }
            .set-keys {
                display: grid;
                grid-template-columns: minmax(7em, 1fr) minmax(5.6em, 11em) minmax(5.6em, 11em);
                gap: 0.35em 0.45em;
                align-items: center;
            }
            .set-keys .set-name {
                font-size: 1em;
            }
            .set-key {
                height: 2.3em;
                padding: 0 0.4em;
                display: flex;
                align-items: center;
                justify-content: center;
                line-height: 1;
                border: 1px solid rgba(217, 168, 69, 0.55);
                border-radius: 4px;
                background: rgba(10, 6, 28, 0.7);
                color: #fff3c9;
                cursor: pointer;
                font:
                    400 0.95em 'Bungee',
                    'Arial Black',
                    sans-serif;
                letter-spacing: 0.03em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .set-key:hover {
                border-color: #ffd86b;
                background: rgba(255, 216, 107, 0.12);
            }
            .set-key.empty {
                color: rgba(185, 168, 232, 0.5);
            }
            .set-key.listening {
                border-color: #fff3c9;
                background: rgba(255, 216, 107, 0.25);
                animation: set-blink 0.8s ease-in-out infinite;
            }
            @keyframes set-blink {
                50% {
                    background: rgba(255, 216, 107, 0.05);
                }
            }
            .set-hint {
                margin: 0.7em 0 0.2em;
                font-size: 0.8em;
                font-style: italic;
                line-height: 1.4;
                color: #a99fc8;
            }
            .set-foot {
                grid-column: 1 / -1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.8em;
                padding: 0.6em 1.1em 0.9em;
                border-top: 1px solid rgba(217, 168, 69, 0.25);
                background: rgba(10, 6, 28, 0.45);
            }
            .set-foot a,
            .set-link {
                color: #b9a8e8;
                font-size: 0.85em;
                background: none;
                border: 0;
                padding: 0;
                cursor: pointer;
                text-decoration: underline;
                font-family: inherit;
            }
            /* Tall layout (portrait, one player): pause in the top-right corner. Touch play is all
               gestures (see Input), so there are no other buttons over the meadow. */
            .screen[data-layout='tall'] .tb-menu {
                top: 1%;
                left: auto;
                right: 1.5%;
                transform: none;
            }
            /* Tall menus: back (select) and exit sit in the top corners, beside the heading. */
            .screen[data-layout='tall']:is(
                    [data-phase='select'],
                    [data-phase='modes'],
                    [data-phase='roster'],
                    [data-phase='profile'],
                    [data-phase='settings'],
                    [data-phase='title']
                )
                .tb-menu {
                top: 1%;
                bottom: auto;
                left: 1.5%;
                right: auto;
            }
            /* Sound toggle for the full-screen game, where the page's mute button is out of sight.
               It shows on the title screen, in the corner the pause button leaves free there. */
            #lobby {
                position: absolute;
                inset: 0;
                display: grid;
                place-items: center;
                background: rgba(16, 11, 36, 0.72);
                border-radius: 14px;
                padding: 1rem;
            }
            #lobby[hidden] {
                display: none;
            }
            .lobby-card {
                width: min(100%, 26rem);
                background: var(--bg);
                color: var(--ink);
                border-radius: 14px;
                padding: 1.2rem 1.4rem;
                display: grid;
                gap: 0.8rem;
                box-shadow:
                    0 0 0 1px var(--edge),
                    0 12px 40px rgba(0, 0, 0, 0.35);
                text-align: center;
            }
            .lobby-card h2 {
                margin: 0;
                font-style: italic;
                font-size: 1.4rem;
            }
            .lobby-friend {
                display: grid;
                gap: 0.5rem;
                padding-top: 0.8rem;
                border-top: 1px solid var(--edge);
            }
            #lobby-join {
                display: flex;
                gap: 0.5rem;
            }
            #lobby-join-code {
                flex: 1;
                min-width: 0;
                font: inherit;
                font-size: 1rem;
                letter-spacing: 0.3em;
                text-align: center;
                text-transform: uppercase;
                padding: 0.5rem 0.8rem;
                border-radius: 999px;
                border: 2px solid var(--edge);
                background: transparent;
                color: var(--ink);
            }
            #lobby-code {
                font-size: 2.4rem;
                font-weight: 700;
                letter-spacing: 0.25em;
                color: var(--ink);
            }
            #lobby-status {
                margin: 0;
                min-height: 1.4em;
                font-size: 0.85rem;
                color: var(--muted);
                overflow-wrap: anywhere;
            }
            canvas {
                display: block;
                width: 100%;
                /* main.ts sets --view-ratio to the current layout's shape (wide or tall). */
                aspect-ratio: var(--view-ratio, 504 / 320);
                border-radius: 14px;
                touch-action: none;
                background: #100b24;
                box-shadow: 0 0 0 1px var(--edge);
            }
            button.link {
                background: none;
                color: var(--muted);
                padding: 0.2rem 0;
                text-decoration: underline;
                font-weight: 400;
                font-size: 0.8rem;
                border-radius: 0;
            }
        </style>
    </head>
    <body>
        <div class="stage immersive" id="stage">
            <div class="screen" id="screen">
                <canvas id="game" tabindex="0" aria-label="Glimmerwing playfield"></canvas>
                <div class="touch-ui" aria-hidden="false">
                    <button class="tb small tb-menu" id="menu-btn" data-key="Escape" aria-label="Pause">❚❚</button>
                </div>
                <div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
                    <div class="set-card">
                        <nav class="set-tabs" role="tablist">
                            <button class="set-tab" role="tab" data-tab="audio" aria-selected="true">Audio</button>
                            <button class="set-tab" role="tab" data-tab="display" aria-selected="false">Display</button>
                            <button class="set-tab" role="tab" data-tab="controls" aria-selected="false">
                                Controls
                            </button>
                        </nav>
                        <div class="set-body">
                            <section class="set-pane" data-pane="audio" role="tabpanel">
                                <div class="set-row">
                                    <span class="set-name">Music</span>
                                    <div class="set-vol">
                                        <input
                                            type="range"
                                            id="set-music"
                                            min="0"
                                            max="100"
                                            step="5"
                                            aria-label="Music volume"
                                        />
                                        <output for="set-music" id="set-music-val">50%</output>
                                    </div>
                                </div>
                                <div class="set-row">
                                    <span class="set-name">Sound effects</span>
                                    <div class="set-vol">
                                        <input
                                            type="range"
                                            id="set-sfx"
                                            min="0"
                                            max="100"
                                            step="5"
                                            aria-label="Sound effects volume"
                                        />
                                        <output for="set-sfx" id="set-sfx-val">70%</output>
                                    </div>
                                </div>
                                <label class="set-row">
                                    <span
                                        ><span class="set-name">Sound on</span
                                        ><small>M switches all sound on or off from the keyboard.</small></span
                                    >
                                    <span class="set-switch"
                                        ><input type="checkbox" id="set-sound" /><span></span
                                    ></span>
                                </label>
                            </section>
                            <section class="set-pane" data-pane="display" role="tabpanel" hidden>
                                <label class="set-row" id="set-full-row">
                                    <span
                                        ><span class="set-name">Fullscreen</span
                                        ><small>Fill the whole screen, with the browser's bars hidden.</small></span
                                    >
                                    <span class="set-switch"><input type="checkbox" id="set-full" /><span></span></span>
                                </label>
                                <label class="set-row">
                                    <span
                                        ><span class="set-name">Hide the rival's meadow</span
                                        ><small
                                            >On a phone held upright, against the CPU: your meadow fills the whole
                                            screen, with a slim bar for the round and the rival's hearts.</small
                                        ></span
                                    >
                                    <span class="set-switch"
                                        ><input type="checkbox" id="set-hide-rival" /><span></span
                                    ></span>
                                </label>
                            </section>
                            <section class="set-pane" data-pane="controls" role="tabpanel" hidden>
                                <div class="set-schemes" role="group" aria-label="Whose keys">
                                    <button class="set-scheme" data-scheme="solo" aria-pressed="true">
                                        One player
                                    </button>
                                    <button class="set-scheme" data-scheme="p1" aria-pressed="false">
                                        2P: Player 1
                                    </button>
                                    <button class="set-scheme" data-scheme="p2" aria-pressed="false">
                                        2P: Player 2
                                    </button>
                                </div>
                                <div class="set-keys" id="set-keys"></div>
                                <p class="set-hint">
                                    Click a key, then press the new one. Esc cancels, Backspace clears it. Gamepads keep
                                    their own buttons: A shoots, B bombs, X or Y autofires. Menus always take the
                                    arrows, Enter, Z and Esc.
                                </p>
                                <button class="set-link" id="set-keys-reset">Reset these keys to the defaults</button>
                            </section>
                        </div>
                        <footer class="set-foot">
                            <a href="guide.html">How to play &amp; controls</a>
                        </footer>
                    </div>
                </div>
                <div id="lobby" role="dialog" aria-modal="true" aria-labelledby="lobby-title" hidden>
                    <div class="lobby-card">
                        <h2 id="lobby-title">Play online</h2>
                        <button id="lobby-quick">Find match</button>
                        <div class="lobby-friend">
                            <button id="lobby-host" class="ghost">Create friend room</button>
                            <form id="lobby-join">
                                <input
                                    id="lobby-join-code"
                                    maxlength="4"
                                    placeholder="CODE"
                                    autocomplete="off"
                                    autocapitalize="characters"
                                    spellcheck="false"
                                    aria-label="Room code"
                                />
                                <button class="ghost">Join</button>
                            </form>
                        </div>
                        <output id="lobby-code" hidden></output>
                        <p id="lobby-status" role="status" aria-live="polite"></p>
                        <button class="link" id="lobby-close">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            /*__BUNDLE__*/
        </script>
    </body>
</html>
